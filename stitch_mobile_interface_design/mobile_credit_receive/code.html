<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Credit Receive / Khata</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          colors: {
            primary: '#001b3d',
            'primary-content': '#ffffff',
            surface: '#f7fafc',
            'surface-container': '#ebeeee',
            'surface-container-low': '#f1f4f6',
            'surface-container-high': '#e5e8e9',
            'surface-container-highest': '#dfe2e3',
            'on-surface': '#181c1e',
            'on-surface-variant': '#40484a',
            outline: '#70787a',
            'outline-variant': '#bfc8ca',
            success: '#16a34a', // Using a standard green for success
            'success-content': '#ffffff',
            error: '#dc2626',
            'error-content': '#ffffff',
            purple: '#9333ea'
          },
          borderRadius: {
            'xl': '0.5rem', // ROUND_FOUR approximation
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    body {
      background-color: theme('colors.surface');
      color: theme('colors.on-surface');
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbar for a cleaner mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- BEGIN: MobileHeader -->
<header class="bg-primary text-primary-content p-4 flex items-center justify-between sticky top-0 z-10 shadow-md" data-purpose="mobile-header">
<div class="flex items-center gap-3">
<button aria-label="Open Menu" class="p-2 -ml-2 rounded-full hover:bg-white/10 transition-colors">
<i class="ph ph-list text-2xl"></i>
</button>
<h1 class="text-lg font-semibold tracking-wide">Credit Receive</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full bg-white/10 hover:bg-white/20 transition-colors text-sm flex items-center gap-1">
<i class="ph ph-barcode text-lg"></i>
</button>
</div>
</header>
<!-- END: MobileHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 p-4 flex flex-col gap-6" data-purpose="main-content">
<!-- BEGIN: RecordPaymentSection -->
<section class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/50 overflow-hidden" data-purpose="record-payment-form">
<div class="bg-surface-container p-3 border-b border-outline-variant/50 flex items-center gap-2">
<i class="ph ph-envelope-simple text-primary text-lg"></i>
<h2 class="font-semibold text-primary">Record Credit Payment</h2>
</div>
<form class="p-4 flex flex-col gap-4">
<!-- Customer Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface-variant" for="customerName">Customer Name:</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-primary text-sm p-2.5 placeholder:text-outline-variant" id="customerName" placeholder="Customer name..." type="text"/>
</div>
<!-- Amount Received Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface-variant" for="amountReceived">Amount Received (Rs.):</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-primary text-sm p-2.5 placeholder:text-outline-variant" id="amountReceived" placeholder="0.00" type="number"/>
</div>
<!-- Notes Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface-variant" for="notes">Notes:</label>
<input class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-primary text-sm p-2.5 placeholder:text-outline-variant" id="notes" placeholder="Optional notes..." type="text"/>
</div>
<!-- Submit Button -->
<button class="mt-2 bg-success text-success-content py-3 px-4 rounded-md font-medium flex items-center justify-center gap-2 hover:bg-success/90 transition-colors active:scale-95" type="submit">
<i class="ph ph-check-circle text-lg"></i>
          Save Payment
        </button>
</form>
</section>
<!-- END: RecordPaymentSection -->
<!-- BEGIN: CreditHistorySection -->
<section class="flex flex-col gap-3 pb-8" data-purpose="credit-history-list">
<!-- Section Header -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-2">
<i class="ph ph-receipt text-primary text-lg"></i>
<h2 class="font-semibold text-primary">Credit History</h2>
</div>
<div class="text-xs font-medium text-purple text-right">
          Total Collections:<br/>
<span class="text-sm">Rs. 4,500.00</span>
</div>
</div>
<!-- History Cards Container -->
<div class="flex flex-col gap-3">
<!-- History Item Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-2">
<div class="flex justify-between items-start mb-1">
<span class="font-semibold text-on-surface">Dr. Tariq Clinic</span>
<span class="font-bold text-purple">Rs. 4,500.00</span>
</div>
<div class="flex items-center gap-1.5 text-xs text-on-surface-variant">
<i class="ph ph-calendar-blank"></i>
<span>2026-08-10 14:15:00</span>
</div>
<div class="text-sm text-on-surface-variant mt-1 p-2 bg-surface-container-low rounded-md border border-outline-variant/20">
            Paid via Easypaisa for July supplies
          </div>
</div>
<!-- Placeholder for Empty State (Hidden by default, shown for context) -->
<!--
        <div class="bg-surface-container-low rounded-xl p-8 text-center border border-dashed border-outline-variant/50 text-outline">
          <i class="ph ph-folder-open text-3xl mb-2"></i>
          <p class="text-sm">No credit history found.</p>
        </div>
        -->
</div>
</section>
<!-- END: CreditHistorySection -->
</main>
<!-- END: MainContent -->
</body></html>
