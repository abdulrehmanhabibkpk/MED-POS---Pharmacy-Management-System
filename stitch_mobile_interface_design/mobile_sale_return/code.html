<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sale Return / Refund - Mobile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#001b3d',
            'primary-content': '#ffffff',
            surface: '#f7fafc',
            'surface-container': '#ebeeed',
            'surface-container-high': '#e5e8e7',
            outline: '#707775',
            'outline-variant': '#c0c8c5',
            error: '#ba1a1a',
            'error-content': '#ffffff',
          },
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          borderRadius: {
            '4xl': '1rem',
          }
        }
      }
    }
  </script>
<style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: theme('colors.surface');
      color: theme('colors.primary');
    }
  </style>
<!-- FontAwesome for icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen flex flex-col">
<!-- BEGIN: Header -->
<header class="bg-primary text-primary-content p-4 sticky top-0 z-10 shadow-md rounded-b-4xl">
<div class="flex items-center justify-between">
<button aria-label="Menu" class="p-2 hover:bg-white/10 rounded-full transition-colors">
<i class="fa-solid fa-bars text-xl"></i>
</button>
<h1 class="text-lg font-semibold truncate">Sale Return / Refund</h1>
<button aria-label="Scanner" class="p-2 hover:bg-white/10 rounded-full transition-colors">
<i class="fa-solid fa-barcode text-xl"></i>
</button>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-grow p-4 space-y-6">
<!-- BEGIN: Process Sale Return Form -->
<section class="bg-white p-5 rounded-4xl shadow-sm border border-outline-variant space-y-5" data-purpose="sale-return-form">
<h2 class="text-xl font-semibold text-error flex items-center gap-2">
<i class="fa-solid fa-rotate-left"></i>
        Process Sale Return
      </h2>
<form class="space-y-4">
<!-- Barcode Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-gray-700" for="barcode">Barcode:</label>
<div class="relative">
<input class="block w-full pl-3 pr-10 py-3 border-error focus:ring-error focus:border-error sm:text-sm rounded-xl" id="barcode" name="barcode" placeholder="Enter product barcode..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<i class="fa-solid fa-keyboard text-gray-400"></i>
</div>
</div>
</div>
<!-- Return Quantity Input -->
<div class="space-y-1">
<label class="block text-sm font-medium text-gray-700" for="quantity">Return Quantity:</label>
<input class="block w-full px-3 py-3 border-gray-300 focus:ring-primary focus:border-primary sm:text-sm rounded-xl" id="quantity" min="1" name="quantity" type="number" value="1"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-error text-white font-semibold py-3 px-4 rounded-xl shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-error flex justify-center items-center gap-2 transition-colors" type="submit">
<i class="fa-solid fa-rotate-left"></i>
          Process Return
        </button>
</form>
</section>
<!-- END: Process Sale Return Form -->
<!-- BEGIN: Recent Return History List -->
<section class="space-y-4" data-purpose="recent-return-history">
<h3 class="text-lg font-semibold flex items-center gap-2 text-primary">
<i class="fa-solid fa-clock-rotate-left"></i>
        Recent Return History
      </h3>
<!-- Empty State / No Data Placeholder -->
<div class="bg-surface-container rounded-3xl p-6 text-center border border-outline-variant border-dashed">
<p class="text-gray-500 italic">No returns processed yet.</p>
</div>
<!-- Example of a Card (Hidden by default, shown for structure context if needed) -->
<!--
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-outline-variant space-y-2">

            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</span>
            <p class="text-sm font-medium">18-Aug-2026</p>
          </div>

             <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Refund</span>
             <p class="text-sm font-bold text-error">$15.00</p>
          </div>
        </div>
        <hr class="border-surface-container-high my-2">

          <p><span class="text-xs text-gray-500 font-semibold mr-2">Qty:</span> <span class="text-sm">1</span></p>
        </div>
      </div>
      -->
</section>
<!-- END: Recent Return History List -->
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation (Optional/Contextual for Mobile POS) -->
<footer class="bg-white border-t border-outline-variant p-2 flex justify-around items-center rounded-t-4xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-safe">
<button class="flex flex-col items-center p-2 text-gray-500 hover:text-primary transition-colors">
<i class="fa-solid fa-house mb-1"></i>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center p-2 text-primary">
<i class="fa-solid fa-rotate-left mb-1"></i>
<span class="text-[10px] font-medium">Return</span>
</button>
<button class="flex flex-col items-center p-2 text-gray-500 hover:text-primary transition-colors">
<i class="fa-solid fa-box-open mb-1"></i>
<span class="text-[10px] font-medium">Products</span>
</button>
<button class="flex flex-col items-center p-2 text-gray-500 hover:text-primary transition-colors">
<i class="fa-solid fa-chart-line mb-1"></i>
<span class="text-[10px] font-medium">Reports</span>
</button>
</footer>
<!-- END: Bottom Navigation -->
</body></html>
