<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Purchase / Stock Receiving</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#001b3d',
            'primary-light': '#1a3350',
            surface: '#f7fafc',
            'surface-container': '#e9eced',
            'surface-container-low': '#f1f4f6',
            success: '#38a169',
            danger: '#e53e3e',
            text: {
              main: '#1a202c',
              muted: '#718096'
            }
          },
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '4px',
            md: '4px',
            lg: '4px',
          }
        }
      }
    }
  </script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: #f7fafc;
      color: #1a202c;
    }
  </style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-surface antialiased min-h-screen flex flex-col">
<!-- BEGIN: Mobile Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-10" data-purpose="mobile-header">
<div class="px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<!-- Sidebar Toggle -->
<button aria-label="Open Menu" class="text-primary focus:outline-none">
<i class="fa-solid fa-bars text-xl"></i>
</button>
<h1 class="text-lg font-bold text-primary truncate">Purchase / Stock Receiving</h1>
</div>
<!-- Actions -->
<div class="flex items-center gap-2">
<button aria-label="Scanner Gun" class="p-2 text-primary focus:outline-none">
<i class="fa-solid fa-barcode"></i>
</button>
</div>
</div>
</header>
<!-- END: Mobile Header -->
<!-- BEGIN: Main Content -->
<main class="flex-1 p-4 space-y-6" data-purpose="main-content">
<!-- BEGIN: Stock Purchase Entry Form -->
<section class="bg-white rounded-lg shadow-sm border border-gray-200 p-4" data-purpose="entry-form">
<div class="flex items-center gap-2 mb-4 text-primary font-semibold border-b border-gray-100 pb-2">
<i class="fa-solid fa-box-open text-success"></i>
<h2>Stock Purchase Entry</h2>
</div>
<form class="space-y-4">
<!-- Supplier Name -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="supplier">Supplier Name:</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="supplier" placeholder="e.g. Al-Madina Pharma Distributors" type="text"/>
</div>
<!-- Barcode -->
<div>
<div class="flex justify-between items-end mb-1">
<label class="block text-sm font-medium text-gray-700" for="barcode">Barcode (Scan Here):</label>
<button class="text-xs text-primary font-medium flex items-center gap-1" type="button">
              Camera Scan <i class="fa-solid fa-camera"></i>
</button>
</div>
<div class="flex rounded-md shadow-sm">
<div class="relative flex-grow focus-within:z-10">
<input class="block w-full rounded-none rounded-l-md border-gray-300 focus:border-primary focus:ring-primary sm:text-sm" id="barcode" placeholder="Scan or enter barcode..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<i class="fa-solid fa-barcode text-gray-400"></i>
</div>
</div>
<button class="relative -ml-px inline-flex items-center space-x-2 rounded-r-md border border-primary bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-light focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" type="button">
<i class="fa-solid fa-magnifying-glass"></i>
<span>Fetch</span>
</button>
</div>
</div>
<!-- Item Name -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="itemName">Item Name:</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="itemName" placeholder="e.g. Cooking Oil 5L / Panadol Extra" type="text"/>
</div>
<!-- Quantities & Prices Row 1 -->
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="qty">Qty Received:</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="qty" type="number" value="1"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="unitCost">Unit Cost Price (Rs.):</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="unitCost" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Quantities & Prices Row 2 -->
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="salePrice">Sale Price (Retail):</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="salePrice" placeholder="0.00" type="number"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="wholesalePrice">Wholesale Price:</label>
<input class="w-full rounded border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" id="wholesalePrice" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full bg-success text-white px-4 py-2 rounded shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-success focus:ring-offset-2 flex items-center justify-center gap-2 font-medium" type="submit">
<i class="fa-solid fa-floppy-disk"></i> Save Purchase
          </button>
</div>
</form>
</section>
<!-- END: Stock Purchase Entry Form -->
<!-- BEGIN: Purchase History Cards -->
<section class="bg-white rounded-lg shadow-sm border border-gray-200 p-4" data-purpose="purchase-history">
<div class="flex items-center justify-between mb-4 border-b border-gray-100 pb-2">
<div class="flex items-center gap-2 text-primary font-semibold">
<i class="fa-solid fa-clock-rotate-left text-success"></i>
<h2>Purchase History</h2>
</div>
<div class="text-sm">
<span class="text-gray-500">Total:</span> <span class="font-bold text-success">Rs. 110,000.00</span>
</div>
</div>
<div class="space-y-3">
<!-- History Card 1 -->
<div class="border border-gray-200 rounded p-3 bg-surface-container-low flex flex-col gap-2">
<div class="flex justify-between items-start">
<div>
<p class="font-medium text-primary text-sm">Al-Madina Distributors</p>
<p class="text-xs text-gray-500">2026-08-04 11:20:00</p>
</div>
<div class="text-right">
<p class="font-bold text-success text-sm">Rs. 110,000.00</p>
</div>
</div>
<div class="text-sm text-gray-700 flex justify-between">
<span class="truncate pr-2">Cooking Oil 5L (1001)</span>
<span class="whitespace-nowrap font-medium text-gray-600">Qty: 50</span>
</div>
</div>
<!-- Placeholder for more cards if needed, keeping it minimal as requested -->
</div>
</section>
<!-- END: Purchase History Cards -->
</main>
<!-- END: Main Content -->
</body></html>
